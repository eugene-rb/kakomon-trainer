<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243149"/>
      <stop offset="0.55" stop-color="#141c2d"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="url(#tile)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#sheen)"/>

    <!-- faint answer sheet -->
    <g transform="rotate(-7 256 256)" opacity="0.10">
      <rect x="150" y="118" width="212" height="276" rx="14" fill="#ffffff"/>
      <g stroke="#0a0e1a" stroke-width="9" stroke-linecap="round" opacity="0.55">
        <line x1="182" y1="176" x2="330" y2="176"/>
        <line x1="182" y1="222" x2="330" y2="222"/>
        <line x1="182" y1="268" x2="330" y2="268"/>
        <line x1="182" y1="314" x2="300" y2="314"/>
      </g>
    </g>

    <!-- grading maru + check -->
    <g transform="rotate(-8 258 258)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 370 332
               A 130 130 0 1 1 326 150"
            stroke="#ff3036" stroke-width="33"/>
      <path d="M 200 262 L 242 312 L 330 206"
            stroke="#ffffff" stroke-width="28"/>
    </g>
  </g>
</svg>
