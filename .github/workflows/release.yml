name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build installer
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = if ($env:RELEASE_REF -match '^v\d+\.\d+\.\d+$') { $env:RELEASE_REF } else { '2.0.1' }
          ./scripts/build_windows.ps1 -Version $version
      - name: Write checksums
        shell: pwsh
        run: |
          # 配布物の破損（ダウンロード途中切れ）を利用者が自分で切り分けられるようにする。
          $lines = Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          if (-not $lines) { throw "No release artifacts to checksum." }
          # sha256sum -c で検証できるよう、改行は CRLF ではなく LF で書く。
          [System.IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", ($lines -join "`n") + "`n", (New-Object System.Text.UTF8Encoding $false))
          Get-Content release/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/KakomonTrainer-Setup.exe
            release/KakomonTrainer-win-x64.zip
            release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: release/*
