name: WPF checks
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build and run offline checks
        shell: pwsh
        run: ./scripts/build_windows.ps1 -PortableOnly
